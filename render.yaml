# Render Blueprint: provisions a PostgreSQL database, the Node API, and the
# static React frontend. Deploy via the Render dashboard "New + Blueprint".
databases:
  - name: etest-db
    databaseName: etest
    user: etest
    plan: free

services:
  # Backend API (Node/Express + Prisma)
  - type: web
    name: etest-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Set this to the deployed frontend URL after first deploy.
      - key: CORS_ORIGIN
        sync: false

  # Frontend (static React build served by Render CDN)
  - type: web
    name: etest-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the deployed API URL, e.g. https://etest-api.onrender.com/api
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
