services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etest
      POSTGRES_PASSWORD: etest
      POSTGRES_DB: etest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etest -d etest"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://etest:etest@db:5432/etest?schema=public
      JWT_SECRET: dev-only-secret-change-me
      JWT_EXPIRES_IN: 2h
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: "http://localhost:8081"
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: "http://localhost:4000/api"
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - server

volumes:
  pgdata:
